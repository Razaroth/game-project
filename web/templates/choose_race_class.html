<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose Race & Class - Cyberdelia EX</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background: url('/static/cyberpunk_city.jpg') center center/cover, linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            color: #caff70;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .choose-box {
            background: rgba(20, 30, 20, 0.92);
            padding: 36px 32px 28px 32px;
            border-radius: 14px;
            box-shadow: 0 0 32px #00ff99cc, 0 0 8px #00ff9944;
            width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #00ff99;
        }
        .preview-row {
            width: 100%;
            display: flex;
            gap: 12px;
            margin: 6px 0 12px 0;
        }
        .preview-card {
            flex: 1;
            border: 1.5px solid #00ff99;
            border-radius: 10px;
            background: rgba(16, 28, 16, 0.85);
            box-shadow: 0 0 8px #00ff9944 inset;
            padding: 10px;
            text-align: center;
        }
        .preview-title {
            color: #00ff99;
            font-size: 0.95rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .portrait {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #00ff99;
            background: #101c10;
        }
        h2 {
            color: #00ff99;
            margin-bottom: 18px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        label {
            margin-top: 12px;
            font-size: 1.1rem;
        }
        select, button {
            width: 80%;
            padding: 10px;
            margin: 10px 0 18px 0;
            background: #101c10;
            color: #caff70;
            border: 1.5px solid #00ff99;
            border-radius: 8px;
            font-size: 1rem;
            box-shadow: 0 0 8px #00ff9944 inset;
        }
        button {
            background: linear-gradient(90deg, #00ff99 0%, #caff70 100%);
            color: #222;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 2px 12px #00ff9944;
            transition: background 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #caff70 0%, #00ff99 100%);
        }
    </style>
</head>
<body>
    <div class="choose-box">
        <h2>Choose Your Race & Class</h2>
        <form method="POST">
            <label for="char_name">Character Name:</label>
            <input type="text" name="char_name" id="char_name" maxlength="24" required placeholder="Enter character name..." style="width:80%;padding:10px;margin:10px 0 18px 0;background:#101c10;color:#caff70;border:1.5px solid #00ff99;border-radius:8px;font-size:1rem;box-shadow:0 0 8px #00ff9944 inset;">

            <div class="preview-row">
                <div class="preview-card">
                    <div class="preview-title">Race Portrait</div>
                    <img id="racePortrait" class="portrait" src="{{ url_for('static', filename='portraits/placeholder.svg') }}" alt="Selected race portrait">
                </div>
                <div class="preview-card">
                    <div class="preview-title">Class Portrait</div>
                    <img id="classPortrait" class="portrait" src="{{ url_for('static', filename='portraits/placeholder.svg') }}" alt="Selected class portrait">
                </div>
            </div>

            <label for="race">Race:</label>
            <select name="race" id="race" required>
                <option value="">-- Select Race --</option>
                {% for race, rdata in races.items() %}
                <option value="{{ race }}" data-image-url="{{ url_for('static', filename=(rdata.image if rdata.image else 'portraits/placeholder.svg')) }}">{{ race }} - {{ rdata.description }}</option>
                {% endfor %}
            </select>
            <label for="char_class">Class:</label>
            <select name="char_class" id="char_class" required>
                <option value="">-- Select Class --</option>
                {% for cname, cdata in classes.items() %}
                <option value="{{ cname }}" data-image-url="{{ url_for('static', filename=(cdata.image if cdata.image else 'portraits/placeholder.svg')) }}">{{ cname }} - {{ cdata.description }}</option>
                {% endfor %}
            </select>
            <button type="submit">Confirm</button>
        </form>
    </div>

    <script>
        (function () {
            const placeholderUrl = "{{ url_for('static', filename='portraits/placeholder.svg') }}";
            const raceSelect = document.getElementById('race');
            const classSelect = document.getElementById('char_class');
            const racePortrait = document.getElementById('racePortrait');
            const classPortrait = document.getElementById('classPortrait');

            function updatePortrait(selectEl, imgEl) {
                const opt = selectEl && selectEl.options ? selectEl.options[selectEl.selectedIndex] : null;
                const url = opt ? opt.getAttribute('data-image-url') : null;
                imgEl.src = url || placeholderUrl;
            }

            raceSelect.addEventListener('change', function () {
                updatePortrait(raceSelect, racePortrait);
            });
            classSelect.addEventListener('change', function () {
                updatePortrait(classSelect, classPortrait);
            });

            // Initialize on page load (useful when the browser restores form state)
            updatePortrait(raceSelect, racePortrait);
            updatePortrait(classSelect, classPortrait);
        })();
    </script>
</body>
</html>
