<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberdelia EX — City Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        html, body { width:100vw; height:100vh; margin:0; padding:0; overflow:hidden; }
        body {
            font-family: 'Share Tech Mono', monospace;
            background: url('/static/cyberpunk_city.jpg') center center/cover, linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            color: #caff70;
        }
        .wrap {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding: 12px 16px;
            background: rgba(20,30,20,0.90);
            border-bottom: 1px solid #00ff99;
            box-shadow: 0 0 14px #00ff9944;
        }
        .title {
            color:#00ff99;
            text-shadow: 0 0 8px #00ff9988, 0 0 2px #222;
            font-size: 1.2rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .hint {
            color:#caff70;
            font-size: 0.9rem;
            opacity: 0.92;
            overflow:hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .main {
            flex: 1;
            display:flex;
            gap: 14px;
            padding: 14px;
            min-height: 0;
        }
        .panel {
            background: rgba(20,30,20,0.92);
            border: 2px solid #00ff99;
            border-radius: 14px;
            box-shadow: 0 0 16px #00ff99aa;
            overflow: hidden;
            min-height: 0;
        }
        #atlas {
            flex: 1 1 auto;
            position: relative;
        }
        #atlas-inner {
            width: 100%;
            height: 100%;
        }
        #details {
            width: 420px;
            max-width: 40vw;
            display:flex;
            flex-direction: column;
        }
        #details h3 {
            margin: 0;
            padding: 10px 12px;
            border-bottom: 1px solid #00ff99;
            color: #00ff99;
            text-shadow: 0 0 8px #00ff9988;
        }
        #details pre {
            margin: 0;
            padding: 12px;
            color: #caff70;
            white-space: pre-wrap;
            overflow: auto;
            flex: 1;
        }
        a.link {
            color: #caff70;
            text-decoration: none;
            border: 1px solid #00ff99;
            border-radius: 10px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.35);
            box-shadow: 0 0 10px #00ff9944;
        }
        a.link:hover { background: rgba(0,0,0,0.55); }

        @keyframes pulsePlayerRing {
            0% { stroke-opacity: 0.55; r: 18; }
            50% { stroke-opacity: 1.0; r: 22; }
            100% { stroke-opacity: 0.55; r: 18; }
        }
        @keyframes pulseXStroke {
            0% { stroke-opacity: 0.45; }
            50% { stroke-opacity: 1.0; }
            100% { stroke-opacity: 0.45; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div style="display:flex;flex-direction:column;min-width:0;">
            <div class="title">Cyberdelia EX — City Map</div>
            <div class="hint">Click a room to view full details. Zoom in to reveal more room names. Current room is marked with an X.</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex:none;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="color:#caff70;font-size:0.85rem;white-space:nowrap;">Zoom</span>
                <input id="zoom" type="range" min="0.6" max="2.5" step="0.1" value="1" />
                <span id="zoom-label" style="color:#caff70;font-size:0.85rem;min-width:48px;text-align:right;">100%</span>
            </div>
            <a class="link" href="/" target="_self">Back</a>
        </div>
    </div>

    <div class="main">
        <div id="atlas" class="panel">
            <div id="atlas-inner"></div>
        </div>

        <div id="details" class="panel">
            <h3>Room Details</h3>
            <pre id="details-text">Loading…</pre>
        </div>
    </div>
</div>

<script id="rooms-data" type="application/json">{{ rooms | tojson }}</script>
<script id="details-data" type="application/json">{{ details | tojson }}</script>
<script id="current-room-data" type="application/json">{{ current_room | tojson }}</script>
<script id="start-room-data" type="application/json">{{ start_room | tojson }}</script>

<script>
    const ROOMS = JSON.parse(document.getElementById('rooms-data').textContent || '{}');
    const DETAILS = JSON.parse(document.getElementById('details-data').textContent || '{}');
    const CURRENT_ROOM = JSON.parse(document.getElementById('current-room-data').textContent || 'null');
    const START_ROOM = JSON.parse(document.getElementById('start-room-data').textContent || 'null');

    function prettyRoomName(key) {
        if (!key || typeof key !== 'string') return '-';
        const spaced = key.replace(/[\-_]+/g, ' ').trim();
        return spaced.replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function formatRoomDetails(roomId) {
        const info = ROOMS[roomId] || {};
        const d = DETAILS[roomId] || {};
        const lines = [];

        lines.push('Room: ' + prettyRoomName(roomId));
        lines.push('Id: ' + roomId);
        if (d.category) lines.push('Category: ' + d.category);
        if (d.danger) lines.push('Danger: ' + d.danger);

        const exits = info.exits || {};
        const exitPairs = Object.entries(exits).map(([dir, dst]) => `${dir} -> ${dst}`);
        lines.push('Exits: ' + (exitPairs.length ? exitPairs.join(', ') : 'None'));

        const npcs = Array.isArray(d.npcs) ? d.npcs : [];
        if (npcs.length) {
            lines.push('NPCs: ' + npcs.map(n => (n && n.name) ? `${n.name}${n.role ? ' (' + n.role + ')' : ''}` : '').filter(Boolean).join(', '));
        } else {
            lines.push('NPCs: None');
        }

        const mobs = Array.isArray(d.mobs) ? d.mobs : [];
        if (mobs.length) {
            const counts = {};
            mobs.forEach(m => { counts[m] = (counts[m] || 0) + 1; });
            const mobTxt = Object.entries(counts).map(([k,v]) => v > 1 ? `${k} x${v}` : k).join(', ');
            lines.push('Mobs: ' + mobTxt);
        } else {
            lines.push('Mobs: None');
        }

        const shop = d.shop && typeof d.shop === 'object' ? d.shop : null;
        const hasShop = shop && Object.keys(shop).length;
        lines.push('Shop: ' + (hasShop ? 'Yes' : 'No'));
        if (hasShop) {
            const items = Object.entries(shop).map(([k,v]) => `${k} (${v} cr)`).join(', ');
            lines.push('Shop Inventory: ' + items);
        }

        const missions = Array.isArray(d.missions) ? d.missions : [];
        const qs = d.quest_status && typeof d.quest_status === 'object' ? d.quest_status : {};
        if (missions.length) {
            lines.push('Missions:');
            missions.forEach(m => {
                const mid = m.id || '';
                const st = qs[mid] || 'available';
                const req = m.required_item ? ` req: ${m.required_item}` : '';
                const rew = ` rewards: +${m.reward_credits || 0} cr, +${m.reward_xp || 0} XP`;
                lines.push(`  ${mid} — ${m.title || mid} (${st})${req}${rew}`);
            });
        } else {
            lines.push('Missions: None');
        }

        lines.push('');
        const desc = (info.description || '').toString().trim();
        if (desc) lines.push(desc);

        return lines.join('\n');
    }

    function renderAtlas(rooms, currentRoom, selectedRoom) {
        const mapArea = document.getElementById('atlas-inner');
        if (!mapArea || !rooms) return;

        // Label density control: show all labels only when zoomed in enough.
        const zoomEl = document.getElementById('zoom');
        const zoomVal = zoomEl ? parseFloat(zoomEl.value || '1') : 1;
        const SHOW_ALL_LABELS_ZOOM = 1.8;
        const showAllLabels = !(Number.isFinite(zoomVal)) ? false : (zoomVal >= SHOW_ALL_LABELS_ZOOM);

        // Build a full-world grid by BFS from start room (no depth cap).
        const dirVec = { north:[0,-1], south:[0,1], east:[1,0], west:[-1,0] };
        const start = rooms[START_ROOM] ? START_ROOM : (rooms[currentRoom] ? currentRoom : Object.keys(rooms)[0]);
        const grid = {};
        const seen = new Set();
        const q = [[start, 0, 0]];
        grid[start] = {x:0, y:0};
        seen.add(start);

        while (q.length) {
            const [room, x, y] = q.shift();
            const exits = rooms[room] && rooms[room].exits ? rooms[room].exits : {};
            for (const [dir, target] of Object.entries(exits)) {
                if (!(dir in dirVec)) continue;
                if (!rooms[target]) continue;
                const [dx, dy] = dirVec[dir];
                const nx = x + dx;
                const ny = y + dy;
                if (grid[target] === undefined) grid[target] = {x:nx, y:ny};
                if (!seen.has(target)) {
                    seen.add(target);
                    q.push([target, nx, ny]);
                }
            }
        }

        // Include any rooms not reached.
        // IMPORTANT: Do NOT throw them at huge coordinates (e.g. 9999,9999),
        // because that explodes the SVG viewBox and makes the map look empty.
        // Instead, place them in a compact cluster adjacent to the reachable blob.
        const unreached = [];
        for (const rid of Object.keys(rooms)) {
            if (grid[rid] === undefined) unreached.push(rid);
        }

        if (unreached.length) {
            let minGX = 0, maxGX = 0, minGY = 0, maxGY = 0;
            let first = true;
            for (const p of Object.values(grid)) {
                if (!p) continue;
                if (first) {
                    minGX = maxGX = p.x;
                    minGY = maxGY = p.y;
                    first = false;
                } else {
                    if (p.x < minGX) minGX = p.x;
                    if (p.x > maxGX) maxGX = p.x;
                    if (p.y < minGY) minGY = p.y;
                    if (p.y > maxGY) maxGY = p.y;
                }
            }

            const perRow = 8;
            const gapX = 6;
            const baseX = maxGX + gapX;
            const baseY = minGY;
            unreached.forEach((rid, idx) => {
                const gx = baseX + (idx % perRow);
                const gy = baseY + Math.floor(idx / perRow);
                grid[rid] = { x: gx, y: gy };
            });
        }

        // Isometric projection
        const tileW = 58;
        const tileH = 34;
        const halfW = tileW / 2;
        const halfH = tileH / 2;
        const depth = 12;

        const isoPos = {};
        let minIsoX = 0, maxIsoX = 0, minIsoY = 0, maxIsoY = 0;
        for (const [room, p] of Object.entries(grid)) {
            const ix = (p.x - p.y) * (tileW / 2);
            const iy = (p.x + p.y) * (tileH / 2);
            isoPos[room] = { x: ix, y: iy };
            if (ix < minIsoX) minIsoX = ix;
            if (ix > maxIsoX) maxIsoX = ix;
            if (iy < minIsoY) minIsoY = iy;
            if (iy > maxIsoY) maxIsoY = iy;
        }

        const pad = 80;
        const width = (maxIsoX - minIsoX) + pad * 2 + tileW + depth;
        const height = (maxIsoY - minIsoY) + pad * 2 + tileH + depth;

        const curIso = isoPos[currentRoom] || {x:0, y:0};
        const curX = (curIso.x - minIsoX) + pad;
        const curY = (curIso.y - minIsoY) + pad;

        // Links first
        let content = '';
        let labels = '';

        for (const [room, pos] of Object.entries(grid)) {
            const exits = rooms[room] && rooms[room].exits ? rooms[room].exits : {};
            for (const [dir, target] of Object.entries(exits)) {
                if (!(dir in dirVec) || !grid[target] || !isoPos[target]) continue;
                if (String(room) > String(target)) continue;
                const p1 = isoPos[room];
                const p2 = isoPos[target];
                const p1x = (p1.x - minIsoX) + pad;
                const p1y = (p1.y - minIsoY) + pad;
                const p2x = (p2.x - minIsoX) + pad;
                const p2y = (p2.y - minIsoY) + pad;
                content += `<line x1="${p1x}" y1="${p1y + 2}" x2="${p2x}" y2="${p2y + 2}" stroke="#00ff99" stroke-width="2" stroke-opacity="0.25" />`;
            }
        }

        // Draw tiles back-to-front
        const roomsSorted = Object.keys(grid).sort((a, b) => {
            const pa = isoPos[a] || {x:0,y:0};
            const pb = isoPos[b] || {x:0,y:0};
            if (pa.y !== pb.y) return pa.y - pb.y;
            return pa.x - pb.x;
        });

        // Label placement: try to avoid overlaps, but never drop labels.
        const usedLabelBoxes = [];
        const approxCharW = 6.8;
        const labelPadX = 8;
        const labelPadY = 5;

        function overlapsAny(box) {
            for (const b of usedLabelBoxes) {
                if (box.x < b.x + b.w && box.x + box.w > b.x && box.y < b.y + b.h && box.y + box.h > b.y) return true;
            }
            return false;
        }

        function placeLabelFor(roomKey, cx, cy, text, isCurrent) {
            const full = text || '';
            const label = full.length > 22 ? full.slice(0, 21) + '…' : full;
            const fontSize = isCurrent ? 12 : 11;
            const textW = Math.max(30, label.length * approxCharW);
            const boxW = textW + labelPadX * 2;
            const boxH = fontSize + labelPadY * 2;
            // Push labels further away from the tile to reduce crowding.
            // This atlas can get dense; favor clarity over compactness.
            const baseY = cy + halfH + 68;

            // Anchor near the tile edge for a leader line.
            const anchorX = cx;
            const anchorY = cy + halfH + 2;

            // Candidate positions are intentionally wide.
            // We try farther placements early to avoid the "bunched up" look.
            const candidates = [
                {dx: 0, dy: 46},
                {dx: -160, dy: 24},
                {dx: 160, dy: 24},
                {dx: -220, dy: 8},
                {dx: 220, dy: 8},
                {dx: -280, dy: 0},
                {dx: 280, dy: 0},
                {dx: 0, dy: 0},

                // Above/beside fallbacks
                {dx: 0, dy: -38},
                {dx: -160, dy: -18},
                {dx: 160, dy: -18},
                {dx: -220, dy: -36},
                {dx: 220, dy: -36},
            ];

            let chosen = null;
            for (const c of candidates) {
                const x = cx + c.dx;
                const y = baseY + c.dy;
                const box = { x: x - boxW / 2, y: y - boxH + 2, w: boxW, h: boxH };
                if (!overlapsAny(box) || isCurrent) {
                    chosen = { x, y, box, label, fontSize };
                    usedLabelBoxes.push(box);
                    break;
                }
            }
            if (!chosen) {
                const x = cx;
                const y = baseY;
                const box = { x: x - boxW / 2, y: y - boxH + 2, w: boxW, h: boxH };
                chosen = { x, y, box, label, fontSize };
                usedLabelBoxes.push(box);
            }

            const fillColor = '#caff70';
            const boxStroke = '#00ff99';
            const boxFill = 'rgba(0,0,0,0.55)';
            const rx = 7;
            const rectX = chosen.box.x;
            const rectY = chosen.box.y;
            const rectW = chosen.box.w;
            const rectH = chosen.box.h;

            // Leader line: from the tile to the label box.
            // Aim at the closest point on the box edge for a tidy connection.
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const lineX2 = clamp(anchorX, rectX + 6, rectX + rectW - 6);
            const lineY2 = clamp(anchorY, rectY + 6, rectY + rectH - 6);
            const showLeader = Math.abs(chosen.x - cx) > 1 || Math.abs((chosen.y - baseY)) > 1;

            return `
                <g style="pointer-events:none;">
                    ${showLeader ? `<line x1="${anchorX}" y1="${anchorY}" x2="${lineX2}" y2="${lineY2}" stroke="#00ff99" stroke-width="2" stroke-opacity="0.22" />` : ''}
                    <rect x="${rectX}" y="${rectY}" width="${rectW}" height="${rectH}" rx="${rx}" fill="${boxFill}" stroke="${boxStroke}" stroke-opacity="0.65" />
                    <text x="${chosen.x}" y="${chosen.y}" text-anchor="middle" font-size="${chosen.fontSize}" font-family="Share Tech Mono, monospace" fill="${fillColor}" style="text-shadow: 0 0 6px rgba(0,255,153,0.35);">${chosen.label}</text>
                </g>`;
        }

        for (const room of roomsSorted) {
            const p = isoPos[room];
            if (!p) continue;
            const cx = (p.x - minIsoX) + pad;
            const cy = (p.y - minIsoY) + pad;

            const isCurrent = room === currentRoom;
            const isSelected = room === selectedRoom;

            const top = [
                [cx, cy - halfH],
                [cx + halfW, cy],
                [cx, cy + halfH],
                [cx - halfW, cy],
            ];
            const bot = top.map(([x, y]) => [x + depth, y + depth]);

            const topPts = top.map(([x,y]) => `${x},${y}`).join(' ');
            const botPts = bot.map(([x,y]) => `${x},${y}`).join(' ');
            const rightFace = `${top[1][0]},${top[1][1]} ${top[2][0]},${top[2][1]} ${bot[2][0]},${bot[2][1]} ${bot[1][0]},${bot[1][1]}`;
            const leftFace  = `${top[3][0]},${top[3][1]} ${top[2][0]},${top[2][1]} ${bot[2][0]},${bot[2][1]} ${bot[3][0]},${bot[3][1]}`;

            const baseFill = isSelected ? '#00ff99' : (isCurrent ? '#00ff99' : '#0c150c');
            const baseOpacity = isSelected ? '0.28' : (isCurrent ? '0.20' : '0.92');
            const strokeW = isSelected ? 3 : 2;

            let node = '';
            node += `<polygon points="${botPts}" fill="#000" fill-opacity="0.16" stroke="none" />`;
            node += `<polygon points="${leftFace}" fill="#00ff99" fill-opacity="0.09" stroke="none" />`;
            node += `<polygon points="${rightFace}" fill="#00ff99" fill-opacity="0.12" stroke="none" />`;
            node += `<polygon points="${topPts}" fill="${baseFill}" fill-opacity="${baseOpacity}" stroke="#00ff99" stroke-width="${strokeW}" filter="url(#mudMapNeonGlow)" />`;

            // When zoomed out, render fewer labels to prevent clutter.
            if (showAllLabels || isCurrent || isSelected) {
                labels += placeLabelFor(room, cx, cy, prettyRoomName(room), isCurrent);
            }
            content += `<g data-room="${room}" style="cursor:pointer;">${node}</g>`;
        }

        // Labels overlay and player marker overlay
        if (labels) {
            content += `<g style="pointer-events:none;">${labels}</g>`;
        }

        let overlay = '';
        if (isoPos[currentRoom]) {
            const cx = curX;
            const cy = curY;
            const ringStyle = `stroke-linecap:round; animation:pulsePlayerRing 1200ms ease-in-out infinite;`;
            const xStyle = `stroke-linecap:round; animation:pulseXStroke 1400ms ease-in-out infinite;`;
            const xSize = 12;

            overlay += `
                <g style="pointer-events:none;">
                    <circle cx="${cx}" cy="${cy}" r="18" fill="none" stroke="#00ff99" stroke-width="3" style="${ringStyle}" filter="url(#mudMapNeonGlow)" />
                    <line x1="${cx - xSize}" y1="${cy - xSize}" x2="${cx + xSize}" y2="${cy + xSize}" stroke="rgba(0,0,0,0.8)" stroke-width="6" />
                    <line x1="${cx - xSize}" y1="${cy + xSize}" x2="${cx + xSize}" y2="${cy - xSize}" stroke="rgba(0,0,0,0.8)" stroke-width="6" />
                    <line x1="${cx - xSize}" y1="${cy - xSize}" x2="${cx + xSize}" y2="${cy + xSize}" stroke="#00ff99" stroke-width="3" style="${xStyle}" filter="url(#mudMapNeonGlow)" />
                    <line x1="${cx - xSize}" y1="${cy + xSize}" x2="${cx + xSize}" y2="${cy - xSize}" stroke="#00ff99" stroke-width="3" style="${xStyle}" filter="url(#mudMapNeonGlow)" />
                </g>`;
        }

        let svg = `<svg id="atlas-svg" width="100%" height="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" style="display:block;">`;
        svg += `<defs>
            <filter id="mudMapNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="0" stdDeviation="1.3" flood-color="#00ff99" flood-opacity="0.45" />
                <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#00ff99" flood-opacity="0.18" />
            </filter>
        </defs>`;
        svg += `<g>` + content + overlay + `</g>`;
        svg += `</svg>`;

        mapArea.innerHTML = svg;

        // Persist base viewBox + a sensible zoom center (prefer current-room marker).
        const svgEl = document.getElementById('atlas-svg');
        if (svgEl) {
            svgEl.dataset.baseViewBox = `0 0 ${width} ${height}`;
            const centerX = isoPos[currentRoom] ? curX : (width / 2);
            const centerY = isoPos[currentRoom] ? curY : (height / 2);
            svgEl.dataset.centerX = String(centerX);
            svgEl.dataset.centerY = String(centerY);
        }
    }

    let selectedRoom = CURRENT_ROOM;

    function applyZoom() {
        const zoomEl = document.getElementById('zoom');
        const labelEl = document.getElementById('zoom-label');
        const svgEl = document.getElementById('atlas-svg');
        if (!zoomEl || !svgEl) return;

        const z = Math.max(0.1, parseFloat(zoomEl.value || '1'));
        if (labelEl) labelEl.textContent = `${Math.round(z * 100)}%`;

        const base = (svgEl.dataset.baseViewBox || '').trim().split(/\s+/).map(Number);
        if (base.length !== 4 || base.some((n) => Number.isNaN(n))) return;
        const baseW = base[2];
        const baseH = base[3];
        const cx = parseFloat(svgEl.dataset.centerX || String(baseW / 2));
        const cy = parseFloat(svgEl.dataset.centerY || String(baseH / 2));

        const newW = baseW / z;
        const newH = baseH / z;
        const x = cx - newW / 2;
        const y = cy - newH / 2;
        svgEl.setAttribute('viewBox', `${x} ${y} ${newW} ${newH}`);
    }

    function updateDetails(roomId) {
        const el = document.getElementById('details-text');
        if (!el) return;
        el.textContent = formatRoomDetails(roomId);
    }

    function rerender() {
        renderAtlas(ROOMS, CURRENT_ROOM, selectedRoom);
        updateDetails(selectedRoom);

        // Apply zoom after re-rendering the SVG.
        applyZoom();

        const root = document.getElementById('atlas-inner');
        if (!root) return;
        root.onclick = (ev) => {
            const target = ev.target;
            const roomEl = target && target.closest ? target.closest('[data-room]') : null;
            const roomTarget = roomEl && roomEl.getAttribute ? roomEl.getAttribute('data-room') : null;
            if (!roomTarget) return;
            selectedRoom = roomTarget;
            rerender();
        };
    }

    // Wire zoom slider.
    const zoomEl = document.getElementById('zoom');
    if (zoomEl) {
        zoomEl.addEventListener('input', () => applyZoom());
    }

    rerender();
</script>
</body>
</html>
